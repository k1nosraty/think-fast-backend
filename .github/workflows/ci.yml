name: backend-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOTE: cross-repository contract drift is enforced by frontend-ci (`check`
# job), which compares the Frontend pin byte-for-byte against the canonical
# Backend bundle. It is deliberately NOT duplicated here: the Frontend
# repository is private, so this workflow's GITHUB_TOKEN cannot check it out
# (that step failed on every run since the job was introduced). The Backend
# side of the invariant — a self-consistent, fixture-validated bundle — is
# covered by `validate_contracts.py` inside the quality job below.
# Optional hardening: create a fine-grained PAT with read access to the
# Frontend repo, store it as the `FRONTEND_READ_TOKEN` Actions secret, and
# re-add a `diff -qr backend/contracts frontend/contracts` job using
# `token: ${{ secrets.FRONTEND_READ_TOKEN }}` on the Frontend checkout step.
jobs:
  quality:
    name: Backend quality and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Run quality, contract and test gates
        run: uv run python scripts/check.py

  security:
    name: Backend security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Run deployment and dependency security gates
        run: uv run python scripts/check_security.py
